name: dbpedia-japanese-mirror

services:
  download:
    build: ./downloader
    image: dbpedia-japanese-mirror/downloader
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ${DATA_DIR:-./data}:/data
    restart: "no"

  load:
    build:
      context: ./loader
    image: dbpedia-japanese-mirror/loader
    env_file: .env
    environment:
      DATA_DIR: /data
      STORE_LOCATION: /store/db
      MARKER_DIR: /store/.loaded
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
      - ${STORE_DIR:-./store}:/store
    depends_on:
      download:
        condition: service_completed_successfully
    restart: "no"

  serve:
    image: ghcr.io/oxigraph/oxigraph:0.5.11@sha256:7532c1f9aa5f28c0dc6a4243198f7f6144017fab7429bf6c164a89fec9411767
    command: ${OXIGRAPH_SERVE_CMD:-serve-read-only} --location /store/db --bind 0.0.0.0:7878 ${OXIGRAPH_SERVE_OPTS:-}
    ports:
      - "${OXIGRAPH_HTTP_PORT:-7878}:7878"
    volumes:
      - ${STORE_DIR:-./store}:/store
    depends_on:
      load:
        condition: service_completed_successfully
    restart: unless-stopped
