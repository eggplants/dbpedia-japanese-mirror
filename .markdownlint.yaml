# Rule configuration for markdownlint. markdownlint-cli2 walks up from each
# linted file collecting these, so this one file covers the whole repository.
#
# 日本語の散文は桁で折り返さないし、README の表はどんな上限より広い。
MD013: false # line-length
MD033: false # inline HTML
MD041: false # first line in file should be a top-level heading
